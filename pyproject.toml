[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prison-architect-agent"
version = "0.1.0a1"
description = "Window-targeted, model-independent Prison Architect controller for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["psutil>=7,<9", "mss>=10,<12"]

[project.scripts]
pa-agent = "pa_agent.app:main"

[tool.setuptools.packages.find]
where = ["src"]
